services:
  postgres:
    image: postgres:16-alpine
    container_name: llmops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-llmops}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    profiles: [app]
    build:
      context: .
      args:
        INSTALL_OCR: ${INSTALL_OCR:-false}
    image: documento-api:local
    env_file: .env
    environment: &backend_environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-llmops}
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    profiles: [app]
    build:
      context: .
      args:
        INSTALL_OCR: ${INSTALL_OCR:-false}
    image: documento-api:local
    env_file: .env
    environment:
      <<: *backend_environment
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    profiles: [app]
    build:
      context: .
      args:
        INSTALL_OCR: ${INSTALL_OCR:-false}
    image: documento-api:local
    env_file: .env
    environment:
      <<: *backend_environment
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: [python, -m, app.worker]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    profiles: [app]
    build: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-8080}:80"]
    depends_on:
      api:
        condition: service_healthy
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.2.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
